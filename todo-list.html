<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ Advanced To-Do List App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .app-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-section {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .todo-input {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
        }

        .todo-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .priority-select {
            padding: 14px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .priority-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .add-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            white-space: nowrap;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .filter-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            color: #333;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 5px;
        }

        .todo-list {
            list-style: none;
            max-height: 600px;
            overflow-y: auto;
        }

        .todo-item {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
            border-left: 4px solid #667eea;
        }

        .todo-item.high {
            border-left-color: #f85149;
            background: rgba(248, 81, 73, 0.05);
        }

        .todo-item.medium {
            border-left-color: #d29922;
            background: rgba(210, 153, 34, 0.05);
        }

        .todo-item.low {
            border-left-color: #238636;
            background: rgba(35, 134, 54, 0.05);
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #888;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #667eea;
            flex-shrink: 0;
        }

        .todo-content {
            flex: 1;
        }

        .todo-text {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            word-break: break-word;
        }

        .todo-meta {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            font-size: 11px;
        }

        .todo-date {
            color: #888;
        }

        .priority-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .priority-high {
            background: rgba(248, 81, 73, 0.2);
            color: #f85149;
        }

        .priority-medium {
            background: rgba(210, 153, 34, 0.2);
            color: #d29922;
        }

        .priority-low {
            background: rgba(35, 134, 54, 0.2);
            color: #238636;
        }

        .todo-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .edit-btn {
            border: 1px solid #667eea;
            color: #667eea;
        }

        .edit-btn:hover {
            background: #667eea;
            color: white;
        }

        .delete-btn {
            border: 1px solid #f85149;
            color: #f85149;
        }

        .delete-btn:hover {
            background: #f85149;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state-text {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .empty-state-subtext {
            font-size: 12px;
            color: #aaa;
        }

        .control-bar {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 100px;
        }

        .clear-completed-btn {
            background: #fff5f5;
            color: #f85149;
            border: 1px solid #f85149;
        }

        .clear-completed-btn:hover {
            background: #f85149;
            color: white;
        }

        .export-btn {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .export-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-save {
            background: #667eea;
            color: white;
        }

        .modal-save:hover {
            background: #764ba2;
        }

        .modal-cancel {
            background: #f0f0f0;
            color: #333;
        }

        .modal-cancel:hover {
            background: #e0e0e0;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 16px 24px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
            z-index: 2000;
            max-width: 300px;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .notification.success {
            border-left: 4px solid #238636;
            color: #238636;
        }

        .notification.error {
            border-left: 4px solid #f85149;
            color: #f85149;
        }

        .search-bar {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .search-bar:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        @media (max-width: 600px) {
            .main-card {
                padding: 20px;
                border-radius: 15px;
            }

            .header h1 {
                font-size: 32px;
            }

            .input-section {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }

            .todo-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .todo-actions {
                align-self: flex-end;
            }
        }

        /* Scrollbar styling */
        .todo-list::-webkit-scrollbar {
            width: 6px;
        }

        .todo-list::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 10px;
        }

        .todo-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .todo-list::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>✅ To-Do List</h1>
            <p>Stay organized and boost your productivity</p>
        </div>

        <div class="main-card">
            <!-- Input Section -->
            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="What needs to be done today?"
                    onkeypress="handleKeyPress(event)"
                >
                <select id="prioritySelect" class="priority-select">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
                <button class="add-btn" onclick="addTodo()">➕ Add</button>
            </div>

            <!-- Search Bar -->
            <input 
                type="text" 
                id="searchInput" 
                class="search-bar" 
                placeholder="🔍 Search tasks..."
                onkeyup="searchTodos()"
            >

            <!-- Stats Bar -->
            <div class="stats-bar">
                <div class="stat-card">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="activeCount">0</div>
                    <div class="stat-label">Active</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completedCount">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completionRate">0%</div>
                    <div class="stat-label">Progress</div>
                </div>
            </div>

            <!-- Filter Section -->
            <div class="filter-section">
                <button class="filter-btn active" onclick="filterTodos('all')">All</button>
                <button class="filter-btn" onclick="filterTodos('active')">Active</button>
                <button class="filter-btn" onclick="filterTodos('completed')">Completed</button>
                <button class="filter-btn" onclick="filterTodos('high')">🔴 High Priority</button>
                <button class="filter-btn" onclick="filterTodos('medium')">🟡 Medium Priority</button>
                <button class="filter-btn" onclick="filterTodos('low')">🟢 Low Priority</button>
            </div>

            <!-- Todo List -->
            <ul class="todo-list" id="todoList"></ul>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-state-icon">🎉</div>
                <div class="empty-state-text">No tasks yet!</div>
                <div class="empty-state-subtext">Add a new task to get started</div>
            </div>

            <!-- Control Bar -->
            <div class="control-bar">
                <button class="control-btn clear-completed-btn" onclick="clearCompleted()">🗑️ Clear Completed</button>
                <button class="control-btn export-btn" onclick="exportTodos()">📥 Export as JSON</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-title">Edit Task</div>
            <input type="text" id="editInput" class="modal-input" placeholder="Edit your task">
            <div class="modal-buttons">
                <button class="modal-btn modal-save" onclick="saveEdit()">Save</button>
                <button class="modal-btn modal-cancel" onclick="closeEditModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let todos = [];
        let editingId = null;
        let currentFilter = 'all';

        // Load todos from localStorage on page load
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('todos');
            if (saved) {
                todos = JSON.parse(saved);
            }
            renderTodos();
            updateStats();
        });

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addTodo();
            }
        }

        function addTodo() {
            const input = document.getElementById('todoInput');
            const priority = document.getElementById('prioritySelect').value;
            const text = input.value.trim();

            if (!text) {
                showNotification('Please enter a task', 'error');
                return;
            }

            if (text.length > 100) {
                showNotification('Task is too long (max 100 characters)', 'error');
                return;
            }

            const todo = {
                id: Date.now(),
                text: text,
                completed: false,
                priority: priority,
                createdAt: new Date().toLocaleDateString(),
                dueDate: null
            };

            todos.unshift(todo);
            saveTodos();
            renderTodos();
            updateStats();
            input.value = '';
            document.getElementById('prioritySelect').value = 'medium';
            showNotification('✅ Task added!', 'success');
        }

        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos();
                renderTodos();
                updateStats();
            }
        }

        function deleteTodo(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                todos = todos.filter(t => t.id !== id);
                saveTodos();
                renderTodos();
                updateStats();
                showNotification('🗑️ Task deleted', 'success');
            }
        }

        function openEditModal(id) {
            editingId = id;
            const todo = todos.find(t => t.id === id);
            document.getElementById('editInput').value = todo.text;
            document.getElementById('editModal').classList.add('active');
            document.getElementById('editInput').focus();
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingId = null;
        }

        function saveEdit() {
            const newText = document.getElementById('editInput').value.trim();
            if (!newText) {
                showNotification('Task cannot be empty', 'error');
                return;
            }
            
            const todo = todos.find(t => t.id === editingId);
            if (todo) {
                todo.text = newText;
                saveTodos();
                renderTodos();
                closeEditModal();
                showNotification('✏️ Task updated!', 'success');
            }
        }

        function filterTodos(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderTodos();
        }

        function searchTodos() {
            renderTodos();
        }

        function renderTodos() {
            const list = document.getElementById('todoList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = todos;

            // Apply filter
            if (currentFilter === 'active') {
                filtered = filtered.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filtered = filtered.filter(t => t.completed);
            } else if (['high', 'medium', 'low'].includes(currentFilter)) {
                filtered = filtered.filter(t => t.priority === currentFilter);
            }

            // Apply search
            if (searchTerm) {
                filtered = filtered.filter(t => t.text.toLowerCase().includes(searchTerm));
            }

            // Sort by priority
            const priorityOrder = { high: 0, medium: 1, low: 2 };
            filtered.sort((a, b) => {
                if (a.completed === b.completed) {
                    return priorityOrder[a.priority] - priorityOrder[b.priority];
                }
                return a.completed ? 1 : -1;
            });

            // Render items
            if (filtered.length === 0) {
                list.innerHTML = '';
                document.getElementById('emptyState').style.display = 'block';
            } else {
                document.getElementById('emptyState').style.display = 'none';
                list.innerHTML = filtered.map(todo => `
                    <li class="todo-item ${todo.completed ? 'completed' : ''} ${todo.priority}">
                        <input type="checkbox" class="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${todo.id})">
                        <div class="todo-content">
                            <div class="todo-text">${escapeHtml(todo.text)}</div>
                            <div class="todo-meta">
                                <span class="priority-badge priority-${todo.priority}">${todo.priority}</span>
                                <span class="todo-date">📅 ${todo.createdAt}</span>
                            </div>
                        </div>
                        <div class="todo-actions">
                            <button class="action-btn edit-btn" onclick="openEditModal(${todo.id})">✏️</button>
                            <button class="action-btn delete-btn" onclick="deleteTodo(${todo.id})">🗑️</button>
                        </div>
                    </li>
                `).join('');
            }
        }

        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const active = total - completed;
            const rate = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('totalCount').textContent = total;
            document.getElementById('activeCount').textContent = active;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('completionRate').textContent = rate + '%';
        }

        function clearCompleted() {
            const completed = todos.filter(t => t.completed).length;
            if (completed === 0) {
                showNotification('No completed tasks to clear', 'error');
                return;
            }
            
            if (confirm(`Clear ${completed} completed task(s)?`)) {
                todos = todos.filter(t => !t.completed);
                saveTodos();
                renderTodos();
                updateStats();
                showNotification('✨ Completed tasks cleared!', 'success');
            }
        }

        function exportTodos() {
            const dataStr = JSON.stringify(todos, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `todos-${new Date().toLocaleDateString()}.json`;
            link.click();
            showNotification('📥 Exported successfully!', 'success');
        }

        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideUp 0.3s ease reverse';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Close modal when clicking outside
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') {
                closeEditModal();
            }
        });

        // Allow Enter key in edit modal
        document.getElementById('editInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                saveEdit();
            }
        });
    </script>
</body>
</html>
